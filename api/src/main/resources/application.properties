spring.application.name=api
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:noscam}
spring.datasource.username=${POSTGRES_USER:noscam}
spring.datasource.password=${POSTGRES_PASSWORD:noscam}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

app.encryption-key=${APP_ENCRYPTION_KEY:}
app.jobs.poll-interval-ms=${APP_JOBS_POLL_INTERVAL_MS:2000}

plaid.client-id=${PLAID_CLIENT_ID:}
plaid.secret=${PLAID_SECRET:}
plaid.env=${PLAID_ENV:sandbox}
plaid.webhook-url=${PLAID_WEBHOOK_URL:}
plaid.webhook-verification-enabled=${PLAID_WEBHOOK_VERIFICATION_ENABLED:true}

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] [%X{jobId:-}] %logger{36} - %msg%n
